spring:
  application:
    name: recoverai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recoverai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# ---- Grok (xAI) API — OpenAI-compatible endpoint ----
grok:
  api-key: ${GROK_API_KEY:}
  base-url: ${GROK_BASE_URL:https://api.x.ai/v1}
  model: ${GROK_MODEL:grok-4-fast}
  timeout-ms: ${GROK_TIMEOUT_MS:8000}
  max-retries: 2

# ---- Razorpay Test Mode ----
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: whsec_recoverai_demo_2026
  base-url: https://api.razorpay.com/v1
  mode: TEST

# ---- Default policy values (seeded into policy_rule table on first migration; editable via API afterwards) ----
recoverai:
  policy:
    max-recovery-attempts: 3
    min-retry-interval-minutes: 30
    max-discount-percentage: 10
    max-auto-incentive: 500
    no-contact-after-hour: 21
    stop-after-customer-optout: true
    max-total-recovery-cost: 50000
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.recoverai: INFO
